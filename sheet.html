<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet - Lords of the Dark</title>
<style>
:root {
  --bg: #f6f2e8;
  --ink: #1f1a14;
  --red: #8f1023;
  --line: #d9c39b;
  --field-bg: #fbfbfb;
  --field-line: #d8dbe0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 26px 16px 40px;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}
.page {
  max-width: 1020px;
  margin: 0 auto;
}

input, textarea {
  width: 100%;
  font-family: inherit;
  font-size: 0.72rem;
  color: var(--ink);
  background: var(--field-bg);
  border: 1px solid var(--field-line);
  padding: 1px 4px;
}
input[type="number"] { text-align: center; -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
textarea { resize: vertical; }

label {
  display: block;
  font-size: 0.64rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--red);
  font-weight: 700;
  margin-bottom: 1px;
}

.header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: end;
  margin-bottom: 6px;
}
.header-fields {
  display: grid;
  grid-template-columns: 1fr 1fr 84px;
  gap: 10px;
}
.header-fields input {
  border: none;
  border-bottom: 1px solid #cab28a;
  background: transparent;
  border-radius: 0;
  padding: 2px 0;
}

.vitals {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 2px solid var(--red);
}
.vital {
  min-width: 78px;
  text-align: center;
  border-left: 1px solid #d9c4a5;
  padding: 4px 7px 3px;
}
.vital:first-child { border-left: none; }
.vital .title {
  color: var(--red);
  text-transform: uppercase;
  font-size: 0.68rem;
  font-weight: 700;
}
.vital .value {
  margin: 1px 0 2px;
  font-size: 2.25rem;
  line-height: 1;
  font-weight: 700;
}
.vital .value.single { font-size: 2.1rem; }
.vital .frac {
  width: 30px;
  border: none;
  background: transparent;
  font-size: 2.2rem;
  padding: 0;
}
.vital .bonus {
  width: 54px;
  height: 16px;
  border-radius: 9px;
  font-size: 0.55rem;
  padding: 0;
  text-transform: uppercase;
}

.sheet-grid {
  display: grid;
  grid-template-columns: 154px 1fr;
  gap: 10px;
}

.section-title {
  color: var(--red);
  font-size: 1.9rem;
  line-height: 0.82;
  text-transform: uppercase;
  margin: 7px 0 6px;
}

.left-col .section-title { margin-top: 10px; }

.attr-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
}
.attr-box input {
  height: 50px;
  font-size: 2rem;
  border: 2px solid #ddc395;
}

.grace-box,
.weight-box {
  border: 2px solid var(--red);
  padding: 8px 7px;
  text-align: center;
  margin-top: 12px;
}
.mini-title {
  color: var(--red);
  font-size: 0.9rem;
  text-transform: uppercase;
  font-weight: 700;
}
.grace-meter {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 0;
  border: 1px solid var(--red);
  margin: 7px 6px 4px;
}
.pip-sq {
  height: 13px;
  border-right: 1px solid var(--red);
  background: var(--field-bg);
  cursor: pointer;
}
.pip-sq:last-child { border-right: none; }
.pip-sq.filled { background: var(--red); }
.small-note {
  font-size: 0.68rem;
  color: #5a4f40;
  font-style: italic;
}
.weight-box .wval { font-size: 2.05rem; margin: 5px 0 2px; font-weight: 700; }
.weight-box .wstatus { font-size: 0.72rem; text-transform: uppercase; color: #5a4f40; }

.right-area {
  display: grid;
  grid-template-columns: 1fr;
}

.gear-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.card-stack { display: grid; gap: 8px; }

.gear-card {
  border: 1.5px solid var(--line);
  padding: 5px;
}
.gear-row1 {
  display: grid;
  grid-template-columns: 1fr 50px;
  gap: 4px;
}
.gear-row2 {
  margin-top: 2px;
  display: grid;
  gap: 4px;
}
.gear-row2.cols-1 { grid-template-columns: 1fr; }
.gear-row2.cols-2 { grid-template-columns: 1fr 1fr; }
.gear-row2.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.gear-card input, .gear-card textarea {
  height: 18px;
  font-size: 0.68rem;
}
.gear-notes { margin-top: 2px; }
.gear-notes input { height: 18px; }

.notes-title {
  margin-top: 8px;
  margin-bottom: 6px;
}
.notes-box {
  min-height: 190px;
  border: 1.5px solid var(--line);
  padding: 7px;
}

.artifact-title {
  color: var(--red);
  font-size: 1.85rem;
  line-height: 0.9;
  text-transform: uppercase;
  margin: 12px 0 6px;
}
.artifact-row {
  border: 1.5px solid var(--line);
  padding: 5px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.artifact-row .gear-card { border-width: 1px; }

@media (max-width: 1080px) {
  .header { grid-template-columns: 1fr; }
  .sheet-grid { grid-template-columns: 1fr; }
  .gear-columns { grid-template-columns: 1fr; }
  .artifact-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .header-fields { grid-template-columns: 1fr; }
  .vitals { grid-template-columns: repeat(2, 1fr); }
  .attr-grid { grid-template-columns: 1fr 1fr; }
  .artifact-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<form autocomplete="off" onsubmit="return false;">
<div class="page">

  <div class="header">
    <div class="header-fields">
      <div><label>Character Name</label><input type="text"></div>
      <div><label>Species</label><input type="text"></div>
      <div><label>Level</label><input id="level" type="number" placeholder="1" min="1" oninput="recalc()"></div>
    </div>

    <div class="vitals">
      <div class="vital">
        <div class="title">HP</div>
        <div class="value"><input class="frac" id="hpCurrent" type="number" placeholder="0"> / <span id="hpMax">8</span></div>
        <input class="bonus" type="number" id="hpBonus" placeholder="Bonus" title="Bonus" oninput="recalc()">
      </div>
      <div class="vital">
        <div class="title">Armor</div>
        <div class="value single" id="armorVal">6</div>
        <input class="bonus" type="number" id="armorBonus" placeholder="Bonus" title="Bonus" oninput="recalc()">
      </div>
      <div class="vital">
        <div class="title">Mana</div>
        <div class="value"><input class="frac" id="manaCurrent" type="number" placeholder="0"> / <span id="manaMax">1</span></div>
        <input class="bonus" type="number" id="manaBonus" placeholder="Bonus" title="Bonus" oninput="recalc()">
      </div>
      <div class="vital">
        <div class="title">Speed</div>
        <div class="value single" id="speedVal">6</div>
        <input class="bonus" type="number" id="speedBonus" placeholder="Bonus" title="Bonus" oninput="recalc()">
      </div>
    </div>
  </div>

  <div class="sheet-grid">
    <div class="left-col">
      <div class="section-title">Attributes</div>
      <div class="attr-grid">
        <div class="attr-box"><label>Vigor</label><input id="vigor" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Fortitude</label><input id="fortitude" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Strength</label><input id="strength" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Dexterity</label><input id="dexterity" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Intel.</label><input id="intelligence" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Arcane</label><input id="arcane" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Charisma</label><input id="charisma" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Reflex</label><input id="reflex" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Insight</label><input id="insight" type="number" placeholder="0" oninput="recalc()"></div>
        <div class="attr-box"><label>Aware.</label><input id="awareness" type="number" placeholder="0" oninput="recalc()"></div>
      </div>

      <div class="grace-box">
        <div class="mini-title">Grace</div>
        <div class="grace-meter" id="gracePips"></div>
        <div class="small-note">+1 per failure. Max 8.</div>
      </div>

      <div class="weight-box">
        <div class="mini-title">Weight</div>
        <div class="wval"><span id="totalWeight">0</span> / <span id="maxWeight">1</span></div>
        <div class="wstatus">Status: <span id="bandTag">Light</span></div>
      </div>
    </div>

    <div class="right-area">
      <div class="gear-columns">
        <div>
          <div class="section-title">Defensive Gear</div>
          <div class="card-stack">
            <div class="gear-card">
              <div class="gear-row1">
                <div><label>Armor Name</label><input></div>
                <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
              </div>
              <div class="gear-row2 cols-1">
                <div><label>Armor</label><input type="number"></div>
              </div>
              <div class="gear-notes"><label>Notes</label><input></div>
            </div>

            <div class="gear-card">
              <div class="gear-row1">
                <div><label>Shield Name</label><input></div>
                <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
              </div>
              <div class="gear-row2 cols-1">
                <div><label>Armor/Bonus</label><input></div>
              </div>
              <div class="gear-notes"><label>Notes</label><input></div>
            </div>

            <div class="gear-card">
              <div class="gear-row1">
                <div><label>Cloak/Misc</label><input></div>
                <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
              </div>
              <div class="gear-row2 cols-1">
                <div><label>Stats</label><input></div>
              </div>
              <div class="gear-notes"><label>Notes</label><input></div>
            </div>
          </div>
        </div>

        <div>
          <div class="section-title">Weapons / Catalyst</div>
          <div class="card-stack" id="weaponCards">
            <div class="gear-card">
              <div class="gear-row1">
                <div><label>Weapon</label><input></div>
                <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
              </div>
              <div class="gear-row2 cols-2">
                <div><label>ATK</label><input type="number"></div>
                <div><label>DMG</label><input type="number"></div>
              </div>
              <div class="gear-notes"><label>Notes</label><input></div>
            </div>

            <div class="gear-card">
              <div class="gear-row1">
                <div><label>Weapon</label><input></div>
                <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
              </div>
              <div class="gear-row2 cols-2">
                <div><label>ATK</label><input type="number"></div>
                <div><label>DMG</label><input type="number"></div>
              </div>
              <div class="gear-notes"><label>Notes</label><input></div>
            </div>

            <div class="gear-card">
              <div class="gear-row1">
                <div><label>Weapon</label><input></div>
                <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
              </div>
              <div class="gear-row2 cols-2">
                <div><label>ATK</label><input type="number"></div>
                <div><label>DMG</label><input type="number"></div>
              </div>
              <div class="gear-notes"><label>Notes</label><input></div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-title notes-title">Notes</div>
      <textarea class="notes-box" placeholder="Traits, spells, backstory..."></textarea>

      <div class="artifact-title">Artifact Slots</div>
      <div class="artifact-row">
        <div class="gear-card">
          <div class="gear-row1">
            <div><label>Art 1</label><input></div>
            <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
          </div>
          <div class="gear-notes"><label>Notes</label><input></div>
        </div>

        <div class="gear-card">
          <div class="gear-row1">
            <div><label>Art 2</label><input></div>
            <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
          </div>
          <div class="gear-notes"><label>Notes</label><input></div>
        </div>

        <div class="gear-card">
          <div class="gear-row1">
            <div><label>Art 3</label><input></div>
            <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
          </div>
          <div class="gear-notes"><label>Notes</label><input></div>
        </div>

        <div class="gear-card">
          <div class="gear-row1">
            <div><label>Art 4</label><input></div>
            <div><label>WT</label><input type="number" class="gear-weight" oninput="recalcWeight()"></div>
          </div>
          <div class="gear-notes"><label>Notes</label><input></div>
        </div>
      </div>
    </div>
  </div>

</div>
</form>

<script>
var hpTable = {1:8,2:10,3:12,4:14,5:16,6:18,7:20,8:22,9:24,10:26,11:28,12:30,13:32,14:34,15:36,16:38};

function getInt(id) {
  var el = document.getElementById(id);
  var v = parseInt(el.value, 10);
  return isNaN(v) ? 0 : v;
}

function recalc() {
  var level = Math.max(1, getInt('level'));
  var vigor = getInt('vigor');
  var fortitude = getInt('fortitude');
  var strength = getInt('strength');
  var intelligence = getInt('intelligence');
  var arcane = getInt('arcane');

  var baseHp = hpTable[Math.min(level,16)] || 8;
  if (level > 16) { baseHp += (level - 16) * 2; }
  document.getElementById('hpMax').textContent = baseHp + (vigor * level) + getInt('hpBonus');

  document.getElementById('armorVal').textContent = 6 + fortitude + getInt('armorBonus');
  document.getElementById('manaMax').textContent = level + intelligence + arcane + getInt('manaBonus');

  var maxWeight = Math.max(1, level + strength);
  document.getElementById('maxWeight').textContent = maxWeight;

  recalcWeight();
}

function recalcWeight() {
  var weights = document.querySelectorAll('.gear-weight');
  var total = 0;
  weights.forEach(function(w) {
    var v = parseFloat(w.value);
    if (!isNaN(v)) total += v;
  });
  document.getElementById('totalWeight').textContent = total;

  var maxWeight = parseFloat(document.getElementById('maxWeight').textContent) || 1;
  var pct = total / maxWeight;
  var band = document.getElementById('bandTag');
  var speedMod = 0;
  var label;

  if (pct >= 1) {
    label = 'Overloaded'; speedMod = -6;
  } else if (pct > 0.75) {
    label = 'Heavy'; speedMod = -1;
  } else if (pct >= 0.5) {
    label = 'Medium'; speedMod = 0;
  } else {
    label = 'Light'; speedMod = 1;
  }
  band.textContent = label;

  document.getElementById('speedVal').textContent = Math.max(0, 6 + speedMod + getInt('speedBonus'));
}

function buildFillMeter(container, count) {
  container.innerHTML = '';
  var pips = [];
  for (var i = 0; i < count; i++) {
    var p = document.createElement('div');
    p.className = 'pip-sq';
    pips.push(p);
    container.appendChild(p);
  }
  pips.forEach(function(p, idx) {
    p.onclick = function() {
      pips.forEach(function(pp, i2) {
        if (i2 <= idx) { pp.classList.add('filled'); }
        else { pp.classList.remove('filled'); }
      });
    };
  });
}

document.addEventListener('DOMContentLoaded', function() {
  buildFillMeter(document.getElementById('gracePips'), 8);
  recalc();
});
</script>
</body>
</html>
